dag_type: plain_text
description: Search for WDC and Seagate on Yahoo Finance, extract their share price
  data, and compare the two stocks
name: compare-wdc-and-seagate-stocks
nodes:
  compare-stocks:
    agent: false
    description: Compares the share price data of WDC and Seagate
    name: compare-stocks
    nodes_depended_on:
    - scrape-share-price-data-wdc
    - scrape-share-price-data-seagate
    nodes_dependent_on: []
    prompt: Compare the extracted share price data of WDC and Seagate, highlighting
      their similarities and differences.
  find-share-price-section-seagate:
    agent: false
    description: Locates the share price section of Seagate's search result
    name: find-share-price-section-seagate
    nodes_depended_on:
    - search-for-seagate
    nodes_dependent_on:
    - scrape-share-price-data-seagate
    prompt: Locate the 'price section' of Seagate's results, which displays the current
      share price and real-time market data.
  find-share-price-section-wdc:
    agent: false
    description: Locates the share price section of WDC's search result
    name: find-share-price-section-wdc
    nodes_depended_on:
    - search-for-wdc
    nodes_dependent_on:
    - scrape-share-price-data-wdc
    prompt: Locate the 'price section' of WDC's results, which displays the current
      share price and real-time market data.
  navigate-to-yahoo-finance:
    agent: false
    description: Navigates the web browser to the Yahoo Finance webpage
    name: navigate-to-yahoo-finance
    nodes_depended_on: []
    nodes_dependent_on:
    - search-for-wdc
    - search-for-seagate
    prompt: Type https://finance.yahoo.com/ in the web browser's navigation bar. Press
      Enter to navigate to Yahoo Finance.
  scrape-share-price-data-seagate:
    agent: false
    description: Extracts the share price data from Seagate's search result
    name: scrape-share-price-data-seagate
    nodes_depended_on:
    - find-share-price-section-seagate
    nodes_dependent_on:
    - compare-stocks
    prompt: Use web scraping techniques or a web-scraper tool to extract Seagate's
      current share price data, including market data such as price, high, low, open,
      close, volume, and trading status.
  scrape-share-price-data-wdc:
    agent: false
    description: Extracts the share price data from WDC's search result
    name: scrape-share-price-data-wdc
    nodes_depended_on:
    - find-share-price-section-wdc
    nodes_dependent_on:
    - compare-stocks
    prompt: Use web scraping techniques or a web-scraper tool to extract WDC's current
      share price data, including market data such as price, high, low, open, close,
      volume, and trading status.
  search-for-seagate:
    agent: false
    description: Searches for Seagate on Yahoo Finance's search bar
    name: search-for-seagate
    nodes_depended_on:
    - navigate-to-yahoo-finance
    nodes_dependent_on:
    - find-share-price-section-seagate
    prompt: Type 'Seagate' in the search bar. Press Enter to initiate the search.
  search-for-wdc:
    agent: false
    description: Searches for WDC on Yahoo Finance's search bar
    name: search-for-wdc
    nodes_depended_on:
    - navigate-to-yahoo-finance
    nodes_dependent_on:
    - find-share-price-section-wdc
    prompt: Type 'WDC' in the search bar. Press Enter to initiate the search.
